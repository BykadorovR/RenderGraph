name: Tests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Lavapipe
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Vulkan SDK and Lavapipe
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          install_lavapipe: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Lavapipe
        shell: pwsh
        run: |
          "VK_DRIVER_FILES=C:\lavapipe\share\vulkan\icd.d\lvp_icd.x86_64.json" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DRENDER_GRAPH_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure --timeout 120
